name: daily-price-scrape

on:
  schedule:
    - cron: "30 6 * * *" # 06:30 UTC = 08:30 CEST / 07:30 CET
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape prices and rebuild dashboard
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          python3 src/scrape.py
          python3 src/dashboard.py
          python3 src/export.py

      - name: Commit snapshot and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pricing.db dashboard.html
          git diff --cached --quiet || git commit -m "chore: daily price snapshot"
          # retry once on a concurrent-push race: recommit our generated files
          # on top of the fresh remote head
          git push || {
            git fetch origin main
            git reset --soft origin/main
            git add pricing.db dashboard.html
            git diff --cached --quiet || git commit -m "chore: daily price snapshot"
            git push
          }

      - name: Publish dashboard to gh-pages
        run: |
          mkdir -p /tmp/site
          cp dashboard.html /tmp/site/index.html
          cp history.csv history_excel.csv /tmp/site/
          cd /tmp/site
          git init -b gh-pages -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: publish dashboard"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
